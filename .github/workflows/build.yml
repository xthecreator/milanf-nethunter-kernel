name: Build Moto G Stylus Latest NetHunter Kernel

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-kernel:
    name: Build NetHunter Kernel
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          repository: LineageOS/android_kernel_motorola_sm6375
          ref: lineage-23.2
          path: kernel-source

      - name: Inject NetHunter Support Direct Configuration
        run: |
          cd kernel-source
          
          # Manually force all NetHunter hardware configuration switches into the core architecture config
          TARGET_CONFIG="arch/arm64/configs/vendor/ext_config/lineage_moto-holi.config"
          
          echo "CONFIG_USB_GADGET=y" >> $TARGET_CONFIG
          echo "CONFIG_USB_G_ANDROID=y" >> $TARGET_CONFIG
          echo "CONFIG_USB_F_HID=y" >> $TARGET_CONFIG
          echo "CONFIG_USB_CONFIGFS=y" >> $TARGET_CONFIG
          echo "CONFIG_USB_CONFIGFS_F_HID=y" >> $TARGET_CONFIG
          echo "CONFIG_MAC80211=y" >> $TARGET_CONFIG
          echo "CONFIG_CFG80211=y" >> $TARGET_CONFIG
          echo "CONFIG_CFG80211_WEXT=y" >> $TARGET_CONFIG

      - name: Build
        uses: dabao1955/kernel_build_action@main
        with:
          kernel-url: ./kernel-source/
          config: gki_defconfig
          merge-configs: '["arch/arm64/configs/vendor/ext_config/lineage_moto-holi.config"]'
          arch: arm64
          anykernel3: true
          nethunter: false
          nethunter-patch: false
          release: true
          access-token: ${{ secrets.GITHUB_TOKEN }}
